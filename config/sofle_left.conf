# Left half OLED (central): Bongo Cat banging along to your WPM.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

# Ciclo de la vista de WPM en caliente: compila las seis (bongo cat,
# luna, bongo responsive, numero, velocimetro, grafico) y deja elegir
# cual se ve, desde una tecla o desde ZMK Studio. La eleccion se guarda.
CONFIG_NICE_OLED_WPM_VIEW_SELECTABLE=y

# Report the right half's battery to the host. The central fetches the
# peripheral's level and publishes it as a second Battery Service, labeled
# "Peripheral 0". Most hosts only display the first one; on Linux the
# omarchy-zmk bar plugin reads both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
